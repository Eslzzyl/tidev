[package]
name = "tidev-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Web frontend and HTTP adapter for tidev"
build = "build.rs"

[build-dependencies]
jobserver = "0.1"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http1", "http2", "tokio", "ws"] }
axum-reverse-proxy = { version = "2.2", default-features = false }
async-stream = "0.3"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
mime_guess = "2"
portable-pty = "0.9"
rust-embed = { version = "8", features = ["compression", "interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tidev-core = { path = "../tidev-core" }
tidev-config = { path = "../tidev-config" }
tidev-llm = { path = "../tidev-llm" }
tidev-utils = { path = "../tidev-utils" }
tokio = { version = "1", features = [
    "fs",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = [
    "compression-br",
    "compression-gzip",
    "compression-zstd",
] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
