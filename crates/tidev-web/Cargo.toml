[lib]
name = "tidev_web"

[package]
name = "tidev-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TiDev web server"
build = "build.rs"
include = ["/src", "/build.rs", "/../../web/dist", "/../../web/src", "/../../web/package.json", "/../../web/pnpm-lock.yaml", "/../../web/vite.config.ts", "/../../web/index.html"]

[dependencies]
tidev-engine = { path = "../tidev-engine" }
tidev-storage = { path = "../tidev-storage" }
tidev-llm = { path = "../tidev-llm" }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["tokio", "http2", "ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
mime_guess = "2.0.5"
portable-pty = "0.9.0"
rand = "0.10.1"
rusqlite = { version = "0.39.0", features = ["bundled", "functions", "vtab"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tower-http = { version = "0.6.11", features = [
    "fs",
    "cors",
    "trace",
    "compression-gzip",
    "compression-br",
    "compression-zstd",
] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
log = "0.4.29"

[build-dependencies]
anyhow = "1.0.102"
