[package]
name = "tidev-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev Model Context Protocol (MCP) client"

[lib]
name = "tidev_mcp"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
rmcp = { version = "1.7.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "=1.52.3", features = ["process", "sync", "macros"] }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
tidev-config = { path = "../tidev-config" }
