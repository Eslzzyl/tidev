[package]
name = "tidev-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TiDev gateway bots (Telegram, QQ, Discord, Lark)"

[lib]
name = "tidev_gateway"

[dependencies]
tidev-engine = { path = "../tidev-engine" }
tidev-llm = { path = "../tidev-llm" }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22.1"
futures-util = "0.3.32"
prost = { version = "0.14", default-features = false, features = ["derive"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = [
    "blocking",
    "json",
    "stream",
    "rustls",
    "gzip",
] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
tokio-tungstenite = { version = "0.29.0", features = [
    "rustls-tls-native-roots",
] }
tokio-util = "0.7.18"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
urlencoding = "2.1.3"
log = "0.4.29"
