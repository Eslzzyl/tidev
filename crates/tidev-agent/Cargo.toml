[package]
name = "tidev-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev agent runtime — AgentLoop with Per-Session Event Bus"

[lib]
name = "tidev_agent"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.32"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
tokio = { version = "=1.52.3", features = [
    "sync",
    "macros",
    "rt",
    "time",
] }
tokio-util = "0.7.18"
uuid = { version = "1.23.3", features = ["v4", "serde"] }

tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
tidev-storage = { path = "../tidev-storage" }
tidev-config = { path = "../tidev-config" }
tidev-llm = { path = "../tidev-llm" }
tidev-tools = { path = "../tidev-tools" }
tidev-context = { path = "../tidev-context" }
tidev-hooks = { path = "../tidev-hooks" }
tidev-instructions = { path = "../tidev-instructions" }
tidev-snapshot = { path = "../tidev-snapshot" }
tidev-search = { path = "../tidev-search" }
tidev-mcp = { path = "../tidev-mcp" }
tidev-system-info = { path = "../tidev-system-info" }

[dev-dependencies]
tempfile = "3.27"
