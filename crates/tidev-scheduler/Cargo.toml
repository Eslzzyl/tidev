[package]
name = "tidev-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev task scheduler with cron support"

[lib]
name = "tidev_scheduler"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
cron = "0.16.0"
futures-util = "0.3.32"
log = "0.4.30"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
tokio = { version = "=1.52.3", features = ["time", "process", "sync"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

tidev-engine = { path = "../tidev-engine" }
tidev-storage = { path = "../tidev-storage" }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }

[dev-dependencies]
tempfile = "3.27"
