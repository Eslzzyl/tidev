[package]
name = "tidev-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core orchestration layer for tidev"

[dependencies]
tidev-agent = { path = "../tidev-agent" }
tidev-tools = { path = "../tidev-tools" }
tidev-config = { path = "../tidev-config" }
tidev-storage = { path = "../tidev-storage" }
tidev-llm = { path = "../tidev-llm" }
tidev-snapshot = { path = "../tidev-snapshot" }
tidev-instructions = { path = "../tidev-instructions" }
tidev-logging = { path = "../tidev-logging" }
tidev-search = { path = "../tidev-search" }
tidev-utils = { path = "../tidev-utils" }
tidev-types = { path = "../tidev-types" }
anyhow = "1"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = "0.7"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
async-trait = "0.1"
dirs = "6"
