[package]
name = "tidev-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev configuration loading and management"

[lib]
name = "tidev_config"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
toml = "1.1.2"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
tidev-types = { path = "../tidev-types" }
tidev-llm = { path = "../tidev-llm" }
tidev-hooks = { path = "../tidev-hooks" }
tidev-sync = { path = "../tidev-sync" }