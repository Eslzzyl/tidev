[package]
name = "tidev-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TUI frontend for tidev"

[dependencies]
tidev-core = { path = "../tidev-core" }
tidev-types = { path = "../tidev-types" }
tidev-config = { path = "../tidev-config" }
tidev-utils = { path = "../tidev-utils" }
tidev-search = { path = "../tidev-search" }

anyhow = "1"
ansi-to-tui = "8"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
diffy = "0.5"
log = "0.4"
lru = "0.18"
pulldown-cmark = "0.13"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "macros"] }
serde_json = "1"
syntect = "5.3"
textwrap = "0.16"
tokio = { version = "1", features = ["sync", "rt", "macros", "io-std"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
