[package]
name = "tidev-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TiDev terminal UI"

[lib]
name = "tidev_tui"

[dependencies]
tidev-engine = { path = "../tidev-engine" }
tidev-llm = { path = "../tidev-llm" }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
anyhow = "1.0.102"
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
crossterm = "0.29.0"
diffy = "0.5.0"
dirs = "6.0.0"
fancy-regex = "0.18.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.0"
rayon = "1.12.0"
reqwest = { version = "0.13.3", default-features = false, features = [
    "blocking",
    "json",
    "stream",
    "rustls",
    "gzip",
] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
shlex = "2.0.1"
textwrap = "0.16.2"
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
tokio-util = "0.7.18"
unicode-width = "0.2"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
log = "0.4.29"

[dev-dependencies]
tempfile = "3.27"
