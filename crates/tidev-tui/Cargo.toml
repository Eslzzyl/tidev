[package]
name = "tidev-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev terminal UI (ratatui + crossterm)"

[lib]
name = "tidev_tui"

[dependencies]
ansi-to-tui = "8.0"
anyhow = "1.0.102"
arboard = "3.6.1"
base64 = "0.22.1"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
diffy = "0.5.0"
dirs = "6.0.0"
fancy-regex = "0.18.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
lru = "0.18.0"
log = "0.4.32"
pulldown-cmark = "0.13.4"
ratatui = { version = "0.30.1", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "macros",
    "underline-color",
] }
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
serde_json = "1.0.150"
shlex = "2.0.1"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
textwrap = "0.16.2"
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
tokio-util = "0.7.18"
two-face = { version = "0.5.1", default-features = false, features = [
    "syntect-default-fancy",
] }
unicode-width = "0.2"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.3", features = ["v4", "serde"] }

# tidev workspace crates
tidev-agent = { path = "../tidev-agent" }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
tidev-config = { path = "../tidev-config" }
tidev-tools = { path = "../tidev-tools" }
tidev-utils = { path = "../tidev-utils" }
tidev-snapshot = { path = "../tidev-snapshot" }
tidev-search = { path = "../tidev-search" }

[dev-dependencies]
tempfile = "3.27"
