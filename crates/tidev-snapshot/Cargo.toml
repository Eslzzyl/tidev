[package]
name = "tidev-snapshot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev git snapshot and diff service"

[lib]
name = "tidev_snapshot"

[dependencies]
anyhow = "1.0.102"
blake3 = "1.8.5"
diffy = "0.5.0"
log = "0.4.32"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
tokio = { version = "=1.52.3", features = [
    "sync",
    "time",
    "rt",
    "macros",
    "rt-multi-thread",
] }
tidev-types = { path = "../tidev-types" }
tidev-config = { path = "../tidev-config" }

[dev-dependencies]
tempfile = "3.27"
uuid = { version = "1.23.3", features = ["v4"] }
