[package]
name = "tidev-snapshot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Git-based workspace snapshot service for tidev"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["sync", "rt", "rt-multi-thread", "process", "time", "macros"] }
blake3 = "1"
log = "0.4"
tidev-utils = { path = "../tidev-utils" }
tidev-config = { path = "../tidev-config" }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
