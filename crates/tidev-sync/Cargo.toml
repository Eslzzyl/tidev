[package]
name = "tidev-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev session sync over SSH"

[lib]
name = "tidev_sync"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
tidev-storage = { path = "../tidev-storage" }
