[package]
name = "tidev-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev tool definitions, registry, and built-in tools"

[lib]
name = "tidev_tools"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
diffy = "0.5.0"
dirs = "6.0.0"
dunce = "1"
encoding_rs = "0.8"
futures-util = "0.3.32"
globset = "0.4.18"
grep = "0.4.1"
ignore = "0.4.26"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
log = "0.4.32"
mime_guess = "2.0.5"
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
strsim = "0.11.1"
tempfile = "3.27"
tokio = { version = "=1.52.3", features = [
    "process",
    "sync",
    "time",
    "macros",
    "rt",
] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
html2md = { package = "fast_html2md", version = "0.0.62", default-features = false, features = [
    "rewriter",
    "ignore_cookies",
] }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
tidev-storage = { path = "../tidev-storage" }
tidev-config = { path = "../tidev-config" }
tidev-instructions = { path = "../tidev-instructions" }
tidev-snapshot = { path = "../tidev-snapshot" }
tidev-search = { path = "../tidev-search" }
tidev-mcp = { path = "../tidev-mcp" }
tidev-utils = { path = "../tidev-utils" }

[dev-dependencies]
tempfile = "3.27"
uuid = { version = "1.23.3", features = ["v4"] }
