[package]
name = "tidev-session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev core data model and types"

[lib]
name = "tidev_session"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled", "functions", "vtab"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
log = "0.4.32"
tidev-types = { path = "../tidev-types" }
