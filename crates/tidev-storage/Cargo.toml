[package]
name = "tidev-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SQLite storage layer for tidev — sessions, messages, schema"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions", "vtab"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = { version = "0.13", default-features = false }
tidev-types = { path = "../tidev-types" }

[dev-dependencies]
tempfile = "3"
