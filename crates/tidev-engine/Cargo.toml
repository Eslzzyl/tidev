[package]
name = "tidev-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TiDev backend engine"

[lib]
name = "tidev_engine"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.32"
globset = "0.4.18"
grep = "0.4.1"
ignore = "0.4.25"
notify = "8.2.0"
html2md = { package = "fast_html2md", version = "0.0.62", default-features = false, features = [
    "rewriter",
    "ignore_cookies",
] }
pulldown-cmark = "0.13.3"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", default-features = false, features = [
    "blocking",
    "json",
    "stream",
    "rustls",
    "gzip",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.39.0", features = ["bundled", "functions", "vtab"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
async-trait = "0.1"
syntect = "5.3.0"
two-face = { version = "0.5.1", default-features = false, features = [
    "syntect-default-onig",
] }
textwrap = "0.16.2"
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
toml = "1.1.2"
shlex = "2.0.1"
unicode-width = "0.2"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
rmcp = { version = "1.7.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
diffy = "0.5.0"
blake3 = "1.8.5"
lru = "0.18.0"
rayon = "1.12.0"
mime_guess = "2.0.5"
strsim = "0.11.1"
tokio-tungstenite = { version = "0.29.0", features = [
    "rustls-tls-native-roots",
] }
fancy-regex = "0.18.0"
axum = { version = "0.8.9", features = ["tokio", "http2", "ws"] }
tower-http = { version = "0.6.11", features = [
    "fs",
    "cors",
    "trace",
    "compression-gzip",
    "compression-br",
    "compression-zstd",
] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
portable-pty = "0.9.0"
rand = "0.10.1"
async-stream = "0.3.6"
libc = "0.2.186"
bytes = "1.11.1"
hex = "0.4.3"
prost = { version = "0.14", default-features = false, features = ["derive"] }
log = "0.4.29"
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
tidev-llm = { path = "../tidev-llm" }
tidev-storage = { path = "../tidev-storage" }

[dev-dependencies]
tempfile = "3.27"
