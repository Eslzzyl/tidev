[package]
name = "tidev-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev SQLite storage layer — sessions, schema, migrations"

[lib]
name = "tidev_storage"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.32"
rayon = "1.12.0"
rusqlite = { version = "0.40.1", features = ["bundled", "functions", "vtab"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
zstd = { version = "0.13", default-features = false }

tidev-session = { path = "../tidev-session" }
tidev-types = { path = "../tidev-types" }

[dev-dependencies]
tempfile = "3.27"
