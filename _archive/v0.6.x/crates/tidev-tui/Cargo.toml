[package]
name = "tidev-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tidev terminal UI"

[lib]
name = "tidev_tui"

[dependencies]
tidev-engine = { path = "../tidev-engine" }
tidev-storage = { path = "../tidev-storage" }
tidev-llm = { path = "../tidev-llm" }
tidev-types = { path = "../tidev-types" }
tidev-session = { path = "../tidev-session" }
ansi-to-tui = "8.0"
anyhow = "1.0.102"
arboard = "3.6.1"
base64 = "0.22.1"
blake3 = "1.8.5"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
diffy = "0.5.0"
dirs = "6.0.0"
fancy-regex = "0.18.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
lru = "0.18.0"
pulldown-cmark = "0.13.4"
ratatui = { version = "0.30.1", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "macros",
    "underline-color",
] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
shlex = "2.0.1"
syntect = "5.3.0"
textwrap = "0.16.2"
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
tokio-util = "0.7.18"
two-face = { version = "0.5.1", default-features = false, features = [
    "syntect-default-onig",
] }
unicode-width = "0.2"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
log = "0.4.32"
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3.27"
