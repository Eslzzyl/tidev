[workspace]
members = [
    ".",
    "crates/tidev-types",
    "crates/tidev-session",
    "crates/tidev-llm",
    "crates/tidev-engine",
    "crates/tidev-storage",
    "crates/tidev-tui",
    "crates/tidev-web",
    "crates/tidev-gateway",
    "crates/tidev-scheduler",
]
default-members = [".", "crates/tidev-types", "crates/tidev-session", "crates/tidev-engine", "crates/tidev-tui", "crates/tidev-web", "crates/tidev-gateway", "crates/tidev-scheduler"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Eslzzyl"]
license = "Apache-2.0"

[package]
name = "tidev"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A terminal-based AI coding agent"

repository = "https://github.com/Eslzzyl/tidev"
readme = "README.md"
homepage = "https://github.com/Eslzzyl/tidev"

keywords = ["ai", "coding", "agent", "tui"]
categories = ["development-tools", "command-line-utilities"]

include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.29"
rusqlite = { version = "0.39.0", features = ["bundled", "functions", "vtab"] }
tokio = { version = "=1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-std",
    "signal",
] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
tidev-types = { path = "crates/tidev-types" }
tidev-engine = { path = "crates/tidev-engine" }
tidev-storage = { path = "crates/tidev-storage" }
tidev-tui = { path = "crates/tidev-tui", optional = true }
tidev-web = { path = "crates/tidev-web", optional = true }
tidev-gateway = { path = "crates/tidev-gateway", optional = true }

[features]
default = ["tui", "web", "gateway"]
tui = ["tidev-tui"]
web = ["tidev-web"]
gateway = ["tidev-gateway"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
