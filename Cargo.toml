[workspace]
members = [
    ".",
    "crates/tidev-types",
    "crates/tidev-storage",
    "crates/tidev-llm",
    "crates/tidev-config",
    "crates/tidev-instructions",
    "crates/tidev-snapshot",
    "crates/tidev-search",
    "crates/tidev-utils",
    "crates/tidev-tools",
    "crates/tidev-agent",
    "crates/tidev-core",
    "crates/tidev-tui",
]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"
authors = ["Eslzzyl"]
license = "Apache-2.0"

[package]
name = "tidev"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A terminal-based AI coding agent"

repository = "https://github.com/Eslzzyl/tidev"
readme = "README.md"
homepage = "https://github.com/Eslzzyl/tidev"

keywords = ["ai", "coding", "agent", "tui"]
categories = ["development-tools", "command-line-utilities"]

include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1"
tidev-tui = { path = "crates/tidev-tui" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
