# Bundled provider presets for TiDev.
# These are merged with user config at runtime.

[providers.deepseek]
display_name = "DeepSeek"
base_url = "https://api.deepseek.com/v1"

[providers.deepseek.models.deepseek-chat]
request_model_id = "deepseek-chat"
display_name = "DeepSeek Chat"
context_window = 128000
max_output_tokens = 8192
temperature = 0.7
supports_streaming = true
supports_images = false

[providers.deepseek.models.deepseek-reasoner]
request_model_id = "deepseek-reasoner"
display_name = "DeepSeek Reasoner"
context_window = 128000
max_output_tokens = 8192
temperature = 0.2
supports_streaming = true
supports_images = false

[providers.jdcloud]
display_name = "JD Cloud Coding Plan"
base_url = "https://modelservice.jdcloud.com/coding/openai/v1"

[providers.jdcloud.models.glm-5]
request_model_id = "GLM-5"
display_name = "GLM-5"
context_window = 200000
max_output_tokens = 32768
temperature = 0.7
supports_streaming = true
supports_images = false

[providers.jdcloud.models.kimi-k2-5]
request_model_id = "Kimi-K2.5"
display_name = "Kimi-K2.5"
context_window = 200000
max_output_tokens = 32768
temperature = 0.7
supports_streaming = true
supports_images = true

[providers.jdcloud.models.minimax-m2-5]
